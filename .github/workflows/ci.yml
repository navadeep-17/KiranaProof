name: Product checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Capture dependency lockfile for a reproducible build
        run: |
          echo '__KIRANAPROOF_LOCK_START__'
          cat package-lock.json
          echo '__KIRANAPROOF_LOCK_END__'
      - run: npm run check
      - run: npm run build
